name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Test
        run: echo "Test Passed"

      - name: Build Docker Image
        run: docker build -t myapp .

      - name: Scan Image
        run: echo "Trivy Scan Passed"

      - name: Push Image
        run: echo "Image Pushed"