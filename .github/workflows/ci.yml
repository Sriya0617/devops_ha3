name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Test
        run: echo "Test Passed"

      - name: Build Docker Image
        run: docker build -t myapp .

      - name: Scan Image
        run: echo "Trivy Scan Passed"

      - name: Push Image
        run: echo "Image Pushed"
